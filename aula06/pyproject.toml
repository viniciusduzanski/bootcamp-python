[project]
name = "aula06"
version = "0.1.0"
description = ""
authors = [
    {name = "Vinicius Duzanski",email = "viniciusduzanski@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
package-mode = false
dependencies = [
    "black (>=23.0.0,<24.0.0)",
    "click (>=8.0.0,<9.0.0)",
    "flake8 (>=6.0.0,<7.0.0)",
    "isort (>=6.0.1,<7.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "pre-commit (>=4.2.0,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.taskipy.tasks]
format = """
isort main.py
black main.py
flake8 main.py
"""
